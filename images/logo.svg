<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Aventis ship's helm emblem">
  <g stroke="#C59B5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer rim -->
    <circle cx="24" cy="24" r="20.2"/>
    <circle cx="24" cy="24" r="16.6"/>
    <!-- 8 spokes -->
    <line x1="24" y1="24" x2="24"    y2="3.8"/>
    <line x1="24" y1="24" x2="24"    y2="44.2"/>
    <line x1="24" y1="24" x2="3.8"   y2="24"/>
    <line x1="24" y1="24" x2="44.2"  y2="24"/>
    <line x1="24" y1="24" x2="9.71"  y2="9.71"/>
    <line x1="24" y1="24" x2="38.29" y2="38.29"/>
    <line x1="24" y1="24" x2="38.29" y2="9.71"/>
    <line x1="24" y1="24" x2="9.71"  y2="38.29"/>
    <!-- Inner compass star (N-E-S-W long points) -->
    <path d="M24 12 L26 22 L24 24 L22 22 Z" fill="#C59B5F" stroke="none"/>
    <path d="M24 36 L26 26 L24 24 L22 26 Z" fill="#C59B5F" stroke="none"/>
    <path d="M12 24 L22 22 L24 24 L22 26 Z" fill="#C59B5F" stroke="none"/>
    <path d="M36 24 L26 22 L24 24 L26 26 Z" fill="#C59B5F" stroke="none"/>
  </g>
  <!-- 8 handle knobs -->
  <g fill="#C59B5F">
    <circle cx="24"    cy="2.4"  r="2.1"/>
    <circle cx="24"    cy="45.6" r="2.1"/>
    <circle cx="2.4"   cy="24"   r="2.1"/>
    <circle cx="45.6"  cy="24"   r="2.1"/>
    <circle cx="8.72"  cy="8.72" r="2.1"/>
    <circle cx="39.28" cy="39.28" r="2.1"/>
    <circle cx="39.28" cy="8.72" r="2.1"/>
    <circle cx="8.72"  cy="39.28" r="2.1"/>
  </g>
  <!-- Hub -->
  <circle cx="24" cy="24" r="3.4" fill="#070F17" stroke="#C59B5F" stroke-width="1.6"/>
</svg>
